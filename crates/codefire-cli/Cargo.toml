[package]
name = "codefire-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "codefire-rs"
path = "src/main.rs"

[dependencies]
codefire-core = { path = "../codefire-core" }
codefire-store = { path = "../codefire-store" }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.2"
rustls = { version = "0.21", features = ["dangerous_configuration"] }
rustls-pemfile = "1"
webpki-roots = "0.25"

[dev-dependencies]
tempfile = "=3.10.1"

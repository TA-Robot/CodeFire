[package]
name = "codefire-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
cap-fs-ext = { version = "=4.0.2", features = ["std"] }
cap-std = "=4.0.2"
codefire-core = { path = "../codefire-core" }
codefire-util = { path = "../codefire-util" }
fs2 = "=0.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "=3.10.1"

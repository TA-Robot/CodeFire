[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "algorithm-evolution-agent-lab"
version = "0.1.0"
description = "Experiment automation agent for evolving machine learning algorithm ideas."
requires-python = ">=3.10"

[project.scripts]
evoagent = "evoagent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

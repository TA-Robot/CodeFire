# Project-scoped Codex configuration for CodeFire development.
# Product runtime behavior must not depend on this file.

model = "gpt-5.6-sol"
model_reasoning_effort = "ultra"

[agents]
max_threads = 4
max_depth = 1
job_max_runtime_seconds = 3600

[agents.manager]
description = "Own global planning, lane boundaries, integration order, and final completion audit."
config_file = "agents/ultra.toml"

[agents.architect]
description = "Challenge architecture, invariants, state transitions, security boundaries, and long-horizon trade-offs."
config_file = "agents/ultra.toml"

[agents.reviewer]
description = "Perform adversarial correctness, safety, contract, and evidence review without implementing the patch."
config_file = "agents/ultra.toml"

[agents.researcher]
description = "Explore a bounded technical or product question and return evidence, alternatives, and falsifiable conclusions."
config_file = "agents/high.toml"

[agents.implementer]
description = "Implement one bounded task packet, preserve invariants, run focused checks, and hand off exact evidence."
config_file = "agents/high.toml"

[agents.dogfood_runner]
description = "Exercise CodeFire against the configured dogfood workspace and capture reproducible friction and evidence."
config_file = "agents/high.toml"

[agents.docs_synchronizer]
description = "Synchronize canonical docs from source and validated project state without inventing current-state claims."
config_file = "agents/medium.toml"

[agents.validation_runner]
description = "Run deterministic validation commands and report exact command, result, duration, and environment gaps."
config_file = "agents/medium.toml"

[agents.classifier]
description = "Classify files, issues, and change packages deterministically; flag ambiguity instead of guessing ownership."
config_file = "agents/medium.toml"

# Project-scoped Codex configuration for CodeFire development.
# Product runtime behavior must not depend on this file.

model = "gpt-5.6-sol"
model_reasoning_effort = "ultra"

[agents]
max_threads = 4
max_depth = 1
job_max_runtime_seconds = 3600

[agents.manager]
description = "Own global planning, lane boundaries, integration order, and final completion audit."
config_file = "agents/ultra.toml"

[agents.architect]
description = "Challenge architecture, invariants, state transitions, security boundaries, and long-horizon trade-offs."
config_file = "agents/ultra.toml"

# External worker profiles live in docs/development/ai/agents and must never be
# registered as native Codex agents. Recovery bootstrap uses the host session.
